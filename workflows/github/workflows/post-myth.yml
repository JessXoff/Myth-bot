name: Post Inanna myth

on:
  schedule:
    # Runs daily; the script itself checks elapsed time since the last post
    # and only actually posts once ~3 days have passed (see src/state.js).
    # This avoids the drift you'd get trying to express "every 3 days" as a
    # raw cron pattern across month boundaries.
    - cron: "17 16 * * *" # ~16:17 UTC daily, adjust to whatever time you like
  workflow_dispatch:
    inputs:
      force:
        description: "Post now even if not due yet"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run myth poster
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_POST: ${{ github.event.inputs.force || 'false' }}
        run: node index.js

      - name: Commit updated state
        run: |
          git config user.name "inanna-myth-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "chore: advance myth rotation state [skip ci]"
            git push
          else
            echo "No state change (probably wasn't due to post) — nothing to commit."
          fi
